<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in · Cantana</title>
<meta name="description" content="Log in or create a Cantana account to access full research reports." />
<link rel="stylesheet" href="styles.css" />
<script src="components.js" defer></script>
</head>
<body>

<header id="site-header"></header>

<section class="page-hero">
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">Home</a><span>/</span> Log in</div>
    <span class="eyebrow">Account</span>
    <h1 id="authTitle">Log in</h1>
    <p class="lead" id="authLead">Access full research reports and manage your Cantana account.</p>
  </div>
</section>

<section>
  <div class="wrap" style="max-width:480px">
    <!-- method="post" with no action: if the script ever fails to load, the browser
         never puts the email/password into the URL. The button also stays disabled
         until the login script is ready. -->
    <form id="authForm" method="post" novalidate>
      <div class="ok-msg" id="okMsg"></div>
      <div class="err-msg" id="errMsg" style="display:none"></div>
      <div class="field" id="nameField" hidden>
        <label for="authName">Full name</label>
        <input id="authName" name="name" type="text" placeholder="Jane Tremblay" autocomplete="name" maxlength="120" />
      </div>
      <div class="field">
        <label for="authEmail">Email</label>
        <input id="authEmail" name="email" type="email" required placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="authPassword">Password</label>
        <input id="authPassword" name="password" type="password" required minlength="8" placeholder="At least 8 characters" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="authSubmit" style="width:100%;justify-content:center" disabled>Log in</button>
      <p class="form-note" style="text-align:center;margin-top:14px">
        <a href="#" id="modeToggle">Don't have an account? Sign up</a>
      </p>
    </form>
  </div>
</section>

<footer id="site-footer"></footer>

<script>
  // If the login module can't load (offline, blocked CDN), say so instead of doing nothing.
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (window.__authReady) return;
      var err = document.getElementById('errMsg');
      err.textContent = '⚠️ Login could not load. Please check your connection and refresh the page.';
      err.style.display = 'block';
    }, 4000);
  });
</script>

<script type="module">
  import { supabase, isConfigured, friendlyAuthError, safeNext } from './supabase-client.js';

  const form = document.getElementById('authForm');
  const modeToggle = document.getElementById('modeToggle');
  const okMsg = document.getElementById('okMsg');
  const errMsg = document.getElementById('errMsg');
  const submitBtn = document.getElementById('authSubmit');
  const title = document.getElementById('authTitle');
  const lead = document.getElementById('authLead');
  const nameField = document.getElementById('nameField');
  const passwordInput = document.getElementById('authPassword');

  window.__authReady = true;

  function showError(text) {
    okMsg.style.display = 'none';
    errMsg.textContent = '⚠️ ' + text;
    errMsg.style.display = 'block';
  }
  function showOk(text) {
    errMsg.style.display = 'none';
    okMsg.textContent = text;
    okMsg.style.display = 'block';
  }

  if (!isConfigured) {
    showError("Login isn't configured yet. Add your Supabase URL and anon key to supabase-client.js.");
  } else {
    let mode = new URLSearchParams(window.location.search).get('mode') === 'signup' ? 'signup' : 'signin';

    function render() {
      const signup = mode === 'signup';
      title.textContent = signup ? 'Create your account' : 'Log in';
      lead.textContent = signup
        ? 'Create a free account to read full research reports and get new editions first.'
        : 'Access full research reports and manage your Cantana account.';
      submitBtn.textContent = signup ? 'Create account' : 'Log in';
      modeToggle.textContent = signup ? 'Already have an account? Log in' : "Don't have an account? Sign up";
      nameField.hidden = !signup;
      passwordInput.autocomplete = signup ? 'new-password' : 'current-password';
      okMsg.style.display = 'none';
      errMsg.style.display = 'none';
    }
    render();

    // Already logged in? Go straight to the account (or the requested page).
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) window.location.replace(safeNext());
    });

    modeToggle.addEventListener('click', (e) => {
      e.preventDefault();
      mode = mode === 'signin' ? 'signup' : 'signin';
      render();
    });

    submitBtn.disabled = false;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = passwordInput.value;
      const fullName = document.getElementById('authName').value.trim();

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Please enter a valid email address.');
      if (password.length < 8) return showError('Your password must be at least 8 characters.');

      submitBtn.disabled = true;
      const label = submitBtn.textContent;
      submitBtn.textContent = mode === 'signin' ? 'Logging in…' : 'Creating account…';

      try {
        if (mode === 'signin') {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showOk('✅ Logged in. Taking you to your account…');
          setTimeout(() => window.location.replace(safeNext()), 500);
        } else {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: { full_name: fullName },
              emailRedirectTo: new URL('account.html', window.location.href).href,
            },
          });
          if (error) throw error;
          if (data.session) {
            showOk('✅ Account created. Taking you to your account…');
            setTimeout(() => window.location.replace(safeNext()), 500);
          } else {
            // Email confirmation is on: no session until they click the link.
            showOk('📧 Almost done! We sent a confirmation link to ' + email + '. Click it to activate your account, then log in.');
            form.reset();
          }
        }
      } catch (err) {
        showError(friendlyAuthError(err));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = label;
      }
    });
  }
</script>

</body>
</html>
